[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # @netlify/plugin-nextjs requires 22+; on 20 the build and the plugin run on
  # different Node versions, which Netlify warns about.
  NODE_VERSION = "22"

  # Netlify's secrets scanner flags any environment value it finds in the build
  # output. Every key below is a NEXT_PUBLIC_* variable, which is Next.js's
  # explicit convention for "inline this into the browser bundle" — they are
  # meant to be there, and Firebase web config is public by design. What
  # actually protects the data is firestore.rules.
  #
  # These six are exempted by name rather than turning scanning off, so a
  # genuinely secret variable added later is still caught.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_FIREBASE_API_KEY,NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN,NEXT_PUBLIC_FIREBASE_PROJECT_ID,NEXT_PUBLIC_FIREBASE_APP_ID,NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID,NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET,NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID,NEXT_PUBLIC_SITE_URL"

# Gives Netlify proper Next.js App Router support: server components, dynamic
# routes like /hotel/[id], redirects and the security headers from
# next.config.ts all come through this.
[[plugins]]
  package = "@netlify/plugin-nextjs"
